# Conda environment used for all experiments in the paper.
#
#   conda env create -f environment.yml
#   conda activate odcount
#   pip install -e counting_datasets   # installs the counting-dataset package
#
# Notes
#   - Exported from the Linux (linux-64) compute nodes where the experiments were
#     run.  Package builds are platform-specific; this file will not solve on
#     macOS or Windows.
#   - The local counting-dataset package is intentionally omitted from the pip
#     section below.  Install it from counting_datasets/ as shown above rather
#     than from PyPI, where it does not exist.
name: odcount
